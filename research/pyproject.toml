[project]
name = "risksim-research"
version = "0.1.0"
description = "Model-validation / research layer for the RiskSim systemic-risk engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risksim_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
