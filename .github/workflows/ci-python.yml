name: ci-python

# Research/validation suite: build the nanobind bindings against the pure C++
# core, then run the model-validation tests (they call the shipping core).
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "research/**"
      - "proto/schema.json"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "research/**"
      - "proto/schema.json"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: bindings + validation
    runs-on: ubuntu-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ccache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-Linux-${{ hashFiles('cmake/**', 'engine/**/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            cpm-Linux-

      - name: Build nanobind module (_risksim only)
        run: |
          cmake -S . -B build/py \
            -DRISKSIM_BUILD_PY=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build/py --target _risksim -j

      - name: Install Python deps
        run: python -m pip install --upgrade pip numpy scipy matplotlib pytest

      - name: Run validation tests
        # conftest.py adds engine/py (the `risksim` binding) and research/ to sys.path,
        # and the bank price CSVs are committed so calibration runs offline.
        run: python -m pytest research/tests -q
