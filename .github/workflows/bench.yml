name: bench

# Build the Release Google Benchmark harness, run it, and upload the JSON as a
# build artifact. (No gh-pages history / regression gate here — that needs a
# persistent baseline branch and is left as a follow-up.)
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "bench/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/bench.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "bench/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/bench.yml"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: google-benchmark
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ccache

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-Linux-${{ hashFiles('cmake/**', 'engine/**/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            cpm-Linux-

      - name: Configure + build the benchmark target
        run: |
          cmake -S . -B build/bench \
            -DRISKSIM_BUILD_BENCH=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/bench --target risksim_bench -j

      - name: Run Google Benchmark
        run: |
          bin="$(find build/bench -type f -name 'risksim_bench' -perm -u+x | head -n1)"
          if [ -z "$bin" ]; then
            echo "::error::risksim_bench executable not found"; find build/bench -type f -perm -u+x; exit 1
          fi
          "$bin" --benchmark_min_time=0.2s --benchmark_report_aggregates_only=true \
                 --benchmark_format=json > benchmark_result.json
          echo "---- human-readable summary ----"
          "$bin" --benchmark_min_time=0.1s 2>/dev/null | tail -32 || true

      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_result.json
